# 单文件部署；命令行显式参数覆盖这里的配置。
addr: ":8080"
# 公网使用长随机令牌，建议通过 HTTPS 反向代理访问。
token: ""
# 必须与管理令牌不同；只读角色不能操作服务、进程和容器。
view_token: ""
services: [nginx, docker]
interval: 2s
proc_interval: 5s
# 不可写时回退内存模式；写操作需要可用的审计日志，否则拒绝执行。
data_dir: /var/lib/servmon

# 阈值 0 为关闭。CPU / 内存 / 磁盘为百分比；load1 为绝对负载。
alerts:
  cpu: 90
  mem: 90
  disk: 90
  load1: 0
  service_failed: true
  sustain: 30s
  cooldown: 10m
notify:
  # 可使用单个 URL 字符串，也可以是多个 URL 的列表。
  webhook: []
  # webhook: ["https://example.com/hook"]
  telegram:
    token: ""
    chat_id: ""
