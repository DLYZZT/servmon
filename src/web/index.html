<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>servmon</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0f12" />
    <link rel="icon" href="/icon.svg" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top" id="top">
        <div class="id">
          <div class="name">
            <span class="pulse"></span>
            <h1 id="host">—</h1>
            <span class="badge" id="badge">连接中</span>
          </div>
          <div class="sys" id="sys">正在连接…</div>
        </div>
        <div class="side">
          <div class="kv">
            <span class="k">负载 1/5/15</span><span class="v" id="load">—</span>
          </div>
          <div class="kv">
            <span class="k">本地时间</span><span class="v" id="clock">—</span>
          </div>
          <div class="btns">
            <button class="live" id="alertsButton">
              告警 <b id="alertCount">0</b>
            </button>
            <button class="live" id="language" aria-label="Language">EN</button>
            <button class="live" id="logout" hidden>退出</button>
            <button
              class="live"
              id="theme"
              title="切换主题：跟随系统 / 深色 / 浅色"
            >
              主题 自动
            </button>
            <button class="live" id="live">● 实时刷新</button>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <label
          >时间范围
          <select id="range">
            <option value="3m">3 分钟</option>
            <option value="1h">1 小时</option>
            <option value="24h">24 小时</option>
            <option value="7d">7 天</option>
            <option value="30d">30 天</option>
          </select></label
        ><span id="historyStatus" class="note"></span
        ><span id="roleBadge" class="note"></span>
      </div>
      <section class="grid g4">
        <div class="card" id="cpuCard" style="padding-bottom: 10px">
          <div class="hd">
            <span class="t">CPU</span><span class="r" id="cpuModel"></span>
          </div>
          <div class="big"><b id="cpuV">—</b><span>%</span></div>
          <div class="plot mini">
            <div class="yScale">
              <span>100%</span><span>50%</span><span>0%</span>
            </div>
            <svg
              class="spark"
              viewBox="0 0 300 70"
              preserveAspectRatio="none"
              role="img"
              aria-label="历史曲线"
            >
              <polyline
                id="cpuLine"
                class="st-accent"
                points=""
                fill="none"
                stroke-width="1.6"
                vector-effect="non-scaling-stroke"
              ></polyline>
              <polygon
                id="cpuArea"
                class="fl-accent"
                points=""
                opacity="0.09"
              ></polygon>
            </svg>
          </div>
          <div class="axis" id="cpuAxis"></div>
        </div>

        <div class="card">
          <div class="hd">
            <span class="t" id="memTitle">内存</span
            ><span class="r" id="memText"></span>
          </div>
          <div class="big"><b id="memV">—</b><span>%</span></div>
          <div style="display: flex; flex-direction: column; gap: 9px">
            <div class="bar"><i id="memBar"></i></div>
            <div class="meta2">
              <span id="swapText">Swap —</span
              ><span id="cacheText">缓存 —</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="hd">
            <span class="t" id="diskTitle">磁盘</span
            ><span class="r" id="diskCount"></span>
          </div>
          <div class="disks" id="disks"></div>
        </div>

        <div class="card" style="padding-bottom: 10px">
          <div class="hd">
            <span class="t">网络</span
            ><select id="iface" aria-label="网络接口"></select>
          </div>
          <div class="net2">
            <div class="kv rx">
              <span class="k">↓ 下行</span><span class="v" id="rxV">—</span>
            </div>
            <div class="kv txv">
              <span class="k">↑ 上行</span><span class="v" id="txV">—</span>
            </div>
          </div>
          <div class="note" id="netTotal">累计 —</div>
        </div>
      </section>

      <section class="grid g2">
        <div class="card lg">
          <div class="hd">
            <span class="t">网络流量</span>
            <div class="legend">
              <span class="rx">— 下行</span><span class="tx">— 上行</span
              ><span class="n" id="netRange">近 3 分钟</span>
            </div>
          </div>
          <div class="plot">
            <div class="yScale" id="netScale"></div>
            <svg
              class="chart"
              viewBox="0 0 600 180"
              preserveAspectRatio="none"
              role="img"
              aria-label="历史曲线"
            >
              <line
                class="st-grid"
                x1="0"
                y1="45"
                x2="600"
                y2="45"
                stroke-width="1"
                vector-effect="non-scaling-stroke"
              ></line>
              <line
                class="st-grid"
                x1="0"
                y1="90"
                x2="600"
                y2="90"
                stroke-width="1"
                vector-effect="non-scaling-stroke"
              ></line>
              <line
                class="st-grid"
                x1="0"
                y1="135"
                x2="600"
                y2="135"
                stroke-width="1"
                vector-effect="non-scaling-stroke"
              ></line>
              <polygon
                id="rxArea"
                class="fl-accent"
                points=""
                opacity="0.1"
              ></polygon>
              <polyline
                id="rxLine"
                class="st-accent"
                points=""
                fill="none"
                stroke-width="1.8"
                vector-effect="non-scaling-stroke"
              ></polyline>
              <polyline
                id="txLine"
                class="st-tx"
                points=""
                fill="none"
                stroke-width="1.5"
                vector-effect="non-scaling-stroke"
              ></polyline>
            </svg>
          </div>
          <div class="axis" id="netAxis"></div>
          <div class="note" id="chartHint">移动到图上查看数值</div>
        </div>

        <div class="card lg">
          <div class="hd">
            <span class="t">每核占用</span
            ><span class="r" id="coreCount"></span>
          </div>
          <div class="cores" id="cores"></div>
          <div class="foot">
            <span id="temp">温度 —</span><span id="freq">频率 —</span
            ><span id="procCount">进程 —</span>
          </div>
        </div>
      </section>

      <section class="grid g2b">
        <div class="card lg" style="gap: 14px">
          <div class="hd">
            <span class="t">进程</span>
            <div class="segs">
              <button class="seg on" data-sort="cpu">按 CPU</button>
              <button class="seg" data-sort="mem">按内存</button>
            </div>
          </div>
          <input
            id="procSearch"
            type="search"
            placeholder="搜索名称 / 用户 / PID"
            aria-label="搜索进程"
          />
          <div class="prow phead">
            <span>PID</span><span>命令</span><span class="us">用户</span
            ><span style="text-align: right">CPU</span
            ><span style="text-align: right">内存</span>
          </div>
          <div class="plist" id="procs"></div>
          <div class="pager" id="pager" hidden>
            <span class="info" id="pageInfo"></span>
            <div class="segs">
              <button class="seg" id="pagePrev" aria-label="上一页">‹</button>
              <span class="pageNo" id="pageNo"></span>
              <button class="seg" id="pageNext" aria-label="下一页">›</button>
            </div>
          </div>
        </div>

        <div class="card lg" style="gap: 14px">
          <div class="hd">
            <span class="t">系统服务</span><span class="r">systemd</span>
          </div>
          <div class="svcs" id="services"></div>
          <div class="log" id="log">—</div>
        </div>
      </section>
      <section class="card" id="containersPanel" hidden>
        <div class="hd"><span class="t">Docker 容器</span></div>
        <div id="containers"></div>
      </section>
    </div>
    <dialog id="drawer">
      <div class="drawerHead">
        <h2 id="drawerTitle"></h2>
        <button class="live" id="closeDrawer">关闭</button>
      </div>
      <div id="drawerContent"></div>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <div class="login" id="login">
      <form id="loginForm">
        <div class="t">servmon</div>
        <p>需要访问令牌才能查看此面板。</p>
        <input
          id="tokenIn"
          aria-label="访问令牌"
          type="password"
          placeholder="输入令牌"
          autocomplete="current-password"
        />
        <button type="submit">进入</button>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
