name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check
        run: make check
      - name: Build Linux and macOS for x86_64 and ARM64
        run: make release
      - name: Test installer in isolation
        run: make test-install
      - name: Prepare release files
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          cp bin/servmon-linux-* bin/servmon-darwin-* dist/
          # The release installer knows its repository even when piped to Bash.
          sed "s|^default_repo=.*$|default_repo='$RELEASE_REPO'|" install.sh > dist/install.sh
          cp servmon.example.yaml dist/
          cd dist
          sha256sum servmon-linux-* servmon-darwin-* install.sh servmon.example.yaml > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: servmon-binaries
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: servmon-binaries
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            args=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
